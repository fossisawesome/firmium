name: Release

# Trigger on version tags (e.g. v1.5.2) or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed for this commit
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
            });
            const runs = data.workflow_runs;
            if (runs.length === 0) {
              core.setFailed('No CI workflow runs found for this commit.');
              return;
            }
            const failed = runs.filter(run => run.conclusion !== 'success');
            if (failed.length > 0) {
              core.setFailed(`CI did not pass for this commit: ${failed.map(r => `${r.name} (${r.conclusion})`).join(', ')}`);
            }

  create-release:
    needs: check-ci
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v7

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Firmium ${context.ref.replace('refs/tags/', '')}`,
              body: 'See the release notes.',
              draft: true,
              prerelease: false,
            });
            return data.id;
          result-encoding: string

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            libsecret-1-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libdbus-1-dev \
            pkg-config \
            dpkg-dev \
            rpm

      - name: Set version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release

      - name: Package .deb
        run: |
          mkdir -p deb/DEBIAN \
            deb/usr/bin \
            deb/usr/share/applications \
            deb/usr/share/icons/hicolor/128x128/apps \
            deb/usr/share/icons/hicolor/32x32/apps
          cp target/release/firmium deb/usr/bin/
          cp packaging/firmium.desktop deb/usr/share/applications/
          cp assets/app-icons/128x128.png deb/usr/share/icons/hicolor/128x128/apps/firmium.png
          cp assets/app-icons/32x32.png deb/usr/share/icons/hicolor/32x32/apps/firmium.png
          cat > deb/DEBIAN/control << EOF
          Package: firmium
          Version: ${{ env.VERSION }}
          Architecture: amd64
          Maintainer: fossisawesome
          Depends: libasound2 | libasound2t64, libsecret-1-0, libxkbcommon0, libvulkan1
          Description: OpenSubsonic music streaming desktop client
           Firmium is a low-latency native iced/Rust music streaming client for Linux.
          EOF
          dpkg-deb --build deb firmium_${{ env.VERSION }}_amd64.deb

      - name: Package .rpm
        run: |
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp target/release/firmium ~/rpmbuild/SOURCES/
          cp packaging/firmium.desktop ~/rpmbuild/SOURCES/
          cp assets/app-icons/128x128.png ~/rpmbuild/SOURCES/128x128.png
          cp assets/app-icons/32x32.png ~/rpmbuild/SOURCES/32x32.png
          cat > ~/rpmbuild/SPECS/firmium.spec << 'SPECEOF'
          %define debug_package %{nil}
          Name:      firmium
          Version:   VERSIONTOKEN
          Release:   1
          Summary:   OpenSubsonic music streaming desktop client
          License:   GPL-3.0-only
          URL:       https://github.com/fossisawesome/firmium
          BuildArch: x86_64
          AutoReqProv: no
          Requires:  alsa-lib, libsecret, libxkbcommon, vulkan-loader

          %description
          Firmium is a low-latency native iced/Rust music streaming client for Linux,
          built on the iced GUI framework with symphonia decoding and cpal audio output.

          %install
          install -Dm755 %{_sourcedir}/firmium       %{buildroot}%{_bindir}/firmium
          install -Dm644 %{_sourcedir}/firmium.desktop %{buildroot}%{_datadir}/applications/firmium.desktop
          install -Dm644 %{_sourcedir}/128x128.png   %{buildroot}%{_datadir}/icons/hicolor/128x128/apps/firmium.png
          install -Dm644 %{_sourcedir}/32x32.png     %{buildroot}%{_datadir}/icons/hicolor/32x32/apps/firmium.png

          %files
          %{_bindir}/firmium
          %{_datadir}/applications/firmium.desktop
          %{_datadir}/icons/hicolor/*/apps/firmium.png
          SPECEOF
          sed -i "s/VERSIONTOKEN/${{ env.VERSION }}/" ~/rpmbuild/SPECS/firmium.spec
          rpmbuild -bb ~/rpmbuild/SPECS/firmium.spec
          RPM=$(ls ~/rpmbuild/RPMS/x86_64/firmium-*.rpm | head -1)
          echo "RPM_FILE=$RPM" >> $GITHUB_ENV

      - name: Upload Linux artifacts
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          RPM_FILE: ${{ env.RPM_FILE }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const releaseId = ${{ needs.create-release.outputs.release_id }}
            const debFile = `firmium_${process.env.VERSION}_amd64.deb`
            const files = [debFile, process.env.RPM_FILE].filter(Boolean)
            if (!files.length) throw new Error('No Linux artifacts found')
            for (const file of files) {
              if (!fs.existsSync(file)) throw new Error(`Artifact not found: ${file}`)
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: path.basename(file),
                data: fs.readFileSync(file),
              })
            }

  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = (Select-String '^version = "' Cargo.toml | Select-Object -First 1).Line.Split('"')[1]
          if (-not $version) { Write-Error "Could not parse version from Cargo.toml"; exit 1 }
          Write-Host "Building installer for version: $version"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 /DVERSION=$version packaging\firmium.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const files = fs.readdirSync('.').filter(f => f.startsWith('firmium-setup-') && f.endsWith('.exe'))
            if (!files.length) throw new Error('No NSIS installer found: ' + fs.readdirSync('.').join(', '))
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: files[0],
              data: fs.readFileSync(files[0]),
            })

  build-macos:
    needs: create-release
    runs-on: macos-14

    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: AppleSilicon
          - target: x86_64-apple-darwin
            label: Intel

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assemble .app bundle
        run: |
          APP="Firmium.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/firmium" "$APP/Contents/MacOS/firmium"
          cp assets/app-icons/icon.icns "$APP/Contents/Resources/icon.icns"
          sed "s/VERSIONTOKEN/${{ env.VERSION }}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"

      - name: Package .dmg
        run: |
          mkdir dmg-src
          mv Firmium.app dmg-src/
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname Firmium -srcfolder dmg-src -ov -format UDZO "firmium-${{ env.VERSION }}-${{ matrix.label }}.dmg"

      - name: Upload macOS artifact
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          LABEL: ${{ matrix.label }}
        with:
          script: |
            const fs = require('fs')
            const file = `firmium-${process.env.VERSION}-${process.env.LABEL}.dmg`
            if (!fs.existsSync(file)) throw new Error(`Artifact not found: ${file}`)
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: file,
              data: fs.readFileSync(file),
            })

  build-freebsd:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and package on FreeBSD
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '14.2'
          run: |
            sudo pkg install -y rust alsa-lib dbus libxkbcommon
            cargo build --release

            mkdir -p stage/usr/bin stage/usr/share/applications \
              stage/usr/share/icons/hicolor/128x128/apps \
              stage/usr/share/icons/hicolor/32x32/apps
            cp target/release/firmium stage/usr/bin/
            cp packaging/firmium.desktop stage/usr/share/applications/
            cp assets/app-icons/128x128.png stage/usr/share/icons/hicolor/128x128/apps/firmium.png
            cp assets/app-icons/32x32.png stage/usr/share/icons/hicolor/32x32/apps/firmium.png

            cat > +MANIFEST << EOF
            name: firmium
            version: "${{ env.VERSION }}"
            origin: audio/firmium
            comment: "OpenSubsonic music streaming desktop client"
            desc: "Firmium is a low-latency native iced/Rust music streaming client."
            maintainer: fossisawesome
            www: https://github.com/fossisawesome/firmium
            prefix: /usr
            deps:
              alsa-lib: {origin: audio/alsa-lib}
              dbus: {origin: devel/dbus}
              libxkbcommon: {origin: x11/libxkbcommon}
            EOF

            pkg create -m . -r stage -o .
            mv firmium-${{ env.VERSION }}.pkg firmium-${{ env.VERSION }}-freebsd.pkg

      - name: Upload FreeBSD package
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        with:
          script: |
            const fs = require('fs')
            const file = `firmium-${process.env.VERSION}-freebsd.pkg`
            if (!fs.existsSync(file)) throw new Error(`Artifact not found: ${file}`)
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: file,
              data: fs.readFileSync(file),
            })

  build-android:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      # Sign the release APK with a keystore stored as a base64 secret.
      # Set these repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore

      - name: Build Android APK
        env:
          ANDROID_SIGNING_KEY_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Print and publish APK certificate fingerprint
        id: fingerprint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          [ -n "$APK" ] || { echo "No signed APK found"; exit 1; }
          echo "apk=$APK" >> $GITHUB_OUTPUT
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256' | awk '{print $NF}')
          [ -n "$FINGERPRINT" ] || { echo "Could not extract certificate fingerprint"; exit 1; }
          echo "APK SHA-256 certificate fingerprint: $FINGERPRINT"
          EXISTING=$(gh release view "${{ github.ref_name }}" --json body -q .body)
          printf '%s\n\n---\n**APK certificate fingerprint (SHA-256):**\n`%s`\n\nVerify with: `apksigner verify --print-certs firmium.apk`\n' "$EXISTING" "$FINGERPRINT" > "$RUNNER_TEMP/release_notes.md"
          gh release edit "${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/release_notes.md"

      - name: Upload APK to release
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const apk = '${{ steps.fingerprint.outputs.apk }}'
            if (!apk) throw new Error('No signed APK found — signing may have failed')
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: path.basename(apk),
              data: fs.readFileSync(apk),
            })

  publish-release:
    needs: [create-release, build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })
