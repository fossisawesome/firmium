name: Release

# Trigger on version tags (e.g. v1.5.2) or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed for this commit
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
            });
            const runs = data.workflow_runs;
            if (runs.length === 0) {
              core.setFailed('No CI workflow runs found for this commit.');
              return;
            }
            const failed = runs.filter(run => run.conclusion !== 'success');
            if (failed.length > 0) {
              core.setFailed(`CI did not pass for this commit: ${failed.map(r => `${r.name} (${r.conclusion})`).join(', ')}`);
            }

  create-release:
    needs: check-ci
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v7

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Firmium ${context.ref.replace('refs/tags/', '')}`,
              body: 'See the release notes.',
              draft: true,
              prerelease: false,
            });
            return data.id;
          result-encoding: string

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libssl-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            rpm

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Build .deb and .rpm
        run: |
          npm ci
          npm run tauri:build -- --bundles deb,rpm

      - name: Upload Linux artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            --repo "${{ github.repository }}" --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Build NSIS installer
        run: |
          npm ci
          npm run tauri:build -- --bundles nsis

      - name: Upload Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/release/bundle/nsis/*-setup.exe \
            --repo "${{ github.repository }}" --clobber

  build-macos:
    needs: create-release
    runs-on: macos-14

    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build .dmg
        run: |
          npm ci
          npm run tauri:build -- --target ${{ matrix.target }} --bundles dmg

      # Bundle names differ per arch (aarch64 / x64), so no clobber risk between matrix legs.
      - name: Upload macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg \
            --repo "${{ github.repository }}" --clobber

  build-termium-linux:
    needs: create-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev libsecret-1-dev libdbus-1-dev pkg-config rpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: termium-pkg-linux

      - name: Build .deb and .rpm
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cargo build --release -p termium
          cargo install cargo-deb@3.8.0 cargo-generate-rpm@0.21.0 --locked
          cargo deb -p termium --no-build --output "termium_${VER}_amd64.deb"
          cargo generate-rpm -p termium --output "termium-${VER}-x86_64.rpm"

      - name: Upload Termium Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            termium_*_amd64.deb \
            termium-*-x86_64.rpm \
            --repo "${{ github.repository }}" --clobber

  build-termium-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: termium-pkg-windows

      - name: Build NSIS installer
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cargo build --release -p termium --target x86_64-pc-windows-msvc
          choco install nsis -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION=$VER -DARCH=x86_64-pc-windows-msvc packaging/termium.nsi

      - name: Upload Termium Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            termium-setup-*.exe \
            --repo "${{ github.repository }}" --clobber

  build-termium-macos:
    needs: create-release
    runs-on: macos-14

    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: termium-pkg-${{ matrix.target }}

      - name: Build .dmg
        run: |
          cargo build --release -p termium --target ${{ matrix.target }}
          mkdir dmg-root
          cp target/${{ matrix.target }}/release/termium dmg-root/
          hdiutil create -volname Termium -srcfolder dmg-root -ov -format UDZO "termium-${GITHUB_REF_NAME#v}-${{ matrix.target }}.dmg"

      - name: Upload Termium macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            termium-*.dmg \
            --repo "${{ github.repository }}" --clobber

  build-android:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      # Sign the release APK with a keystore stored as a base64 secret.
      # Set these repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore

      - name: Build Android APK
        env:
          ANDROID_SIGNING_KEY_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Print and publish APK certificate fingerprint
        id: fingerprint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          [ -n "$APK" ] || { echo "No signed APK found"; exit 1; }
          echo "apk=$APK" >> $GITHUB_OUTPUT
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256' | awk '{print $NF}')
          [ -n "$FINGERPRINT" ] || { echo "Could not extract certificate fingerprint"; exit 1; }
          echo "APK SHA-256 certificate fingerprint: $FINGERPRINT"
          EXISTING=$(gh release view "${{ github.ref_name }}" --json body -q .body)
          printf '%s\n\n---\n**APK certificate fingerprint (SHA-256):**\n`%s`\n\nVerify with: `apksigner verify --print-certs firmium.apk`\n' "$EXISTING" "$FINGERPRINT" > "$RUNNER_TEMP/release_notes.md"
          gh release edit "${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/release_notes.md"

      - name: Upload APK to release
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const apk = '${{ steps.fingerprint.outputs.apk }}'
            if (!apk) throw new Error('No signed APK found — signing may have failed')
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: path.basename(apk),
              data: fs.readFileSync(apk),
            })

      # Quest (Horizon OS) variant: no Google libraries, no Android Auto. Same signing key and
      # applicationId as the phone APK, so it can't be installed alongside it.
      - name: Build Quest APK
        env:
          ANDROID_SIGNING_KEY_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android && ./gradlew assembleRelease -Pquest
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          [ -n "$APK" ] || { echo "No signed Quest APK found"; exit 1; }
          cp "$APK" "$RUNNER_TEMP/firmium-quest.apk"

      - name: Upload Quest APK to release
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: 'firmium-quest.apk',
              data: fs.readFileSync(process.env.RUNNER_TEMP + '/firmium-quest.apk'),
            })

  publish-release:
    needs: [create-release, build-linux, build-windows, build-macos, build-termium-linux, build-termium-windows, build-termium-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })
