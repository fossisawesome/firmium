[package]
name = "firmium"
version = "7.0.0"
description = "Subsonic Desktop Music Streamer"
authors = ["fossisawesome"]
edition = "2021"

[[bin]]
name = "firmium"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls so we don't depend on system OpenSSL. blocking is used by the symphonia
# streaming reader; the async client drives the OpenSubsonic API.
reqwest = { version = "0.13.4", features = ["json", "stream", "blocking", "rustls"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
cpal = "0.17.3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
parking_lot = "0.12.5"
bytes = "1"
md5 = "0.8"
rand = "0.10"
toml = "1.1"
lofty = "0.24"
rustfft = "6.4.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Local play-history store. `bundled` compiles SQLite from source so no system libsqlite is needed.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Podcast RSS/Atom feed parsing (client-side; Navidrome has no server-side podcast API).
feed-rs = "2.3.1"
iced = { version = "0.14.0", features = ["canvas", "image", "svg", "tokio", "advanced", "wgpu"] }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17.2"
dirs = "6.0.0"
include_dir = "0.7.4"

# Platform-specific keyring backends: each OS uses its own secure credential store.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[profile.release]
opt-level = 3
codegen-units = 1
strip = false
lto = true
