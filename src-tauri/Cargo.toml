[package]
name = "firmium-desktop"
version = "1.0.0"
description = "Subsonic Desktop Music Streamer"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "3.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-opener = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = "2.5.9"
reqwest = { version = "0.13.3", features = ["json"] }
sysinfo = "0.39.2"

[profile.release]
opt-level = 2       # Keeps Rust optimization high, but won't obfuscate frontend scripts
strip = false       # CRITICAL: Stops Tauri from stripping debug symbols/data from web bundles
lto = true
