[package]
name = "firmium"
version = "5.3.0"
description = "Subsonic Desktop Music Streamer"
authors = ["fossisawesome"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["devtools", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-http = "2.5.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# rustls added so Android builds don't need system OpenSSL; harmless on desktop.
reqwest = { version = "0.13.4", features = ["json", "stream", "blocking", "rustls"] }
rodio = "0.22.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
parking_lot = "0.12.5"
bytes = "1"
md5 = "0.8"
rand = "0.10"
toml = "1.1"

# Platform-specific keyring backends: each OS uses its own secure credential store.
# Android has no keyring dependency; the Rust commands return errors and the JS
# layer falls back to asking the user to log in manually.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[profile.release]
opt-level = 3
codegen-units = 1
strip = false       # Retain Rust debug symbols in the release binary (useful for crash reporting).
lto = true
