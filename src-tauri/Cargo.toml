[package]
name = "firmium"
version.workspace = true
edition.workspace = true
description = "Subsonic Desktop Music Streamer"
authors = ["fossisawesome"]

[lib]
name = "firmium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "firmium"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
firmium-backend = { path = "../backend" }
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[features]
# Embed the built frontend (dist/) instead of loading devUrl. `tauri build` turns
# this on automatically; plain `cargo build --release` (PKGBUILD, COPR) must pass it.
custom-protocol = ["tauri/custom-protocol"]
